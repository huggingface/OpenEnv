name: Deploy HF Environments

on:
  workflow_dispatch:
    inputs:
      envs_csv:
        description: "Comma-separated env names (empty means all deployable envs)"
        required: false
        type: string
        default: ""
      openenv_version:
        description: "Release version used for suffix and pinning (e.g. 0.2.1)"
        required: false
        type: string
        default: "0.2.0"
      hf_namespace:
        description: "Hugging Face namespace"
        required: false
        type: string
        default: "openenv"
      private:
        description: "Deploy version-suffixed spaces as private"
        required: false
        type: boolean
        default: true
      skip_collection:
        description: "Skip collection updates"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Run staging-only dry run"
        required: false
        type: boolean
        default: false
      collection_namespace:
        description: "Collection owner namespace"
        required: false
        type: string
        default: "openenv"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install collection manager dependency
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface-hub>=0.24.0"

      - name: Deploy selected environments
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ENVS_CSV_INPUT: ${{ github.event.inputs.envs_csv }}
          GITHUB_EVENT_INPUTS_HF_NAMESPACE: ${{ github.event.inputs.hf_namespace }}
          GITHUB_EVENT_INPUTS_OPENENV_VERSION: ${{ github.event.inputs.openenv_version }}
          GITHUB_EVENT_INPUTS_COLLECTION_NAMESPACE: ${{ github.event.inputs.collection_namespace }}
          GITHUB_EVENT_INPUTS_PRIVATE: ${{ github.event.inputs.private }}
          GITHUB_EVENT_INPUTS_SKIP_COLLECTION: ${{ github.event.inputs.skip_collection }}
          GITHUB_EVENT_INPUTS_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_hf_deployment.sh

          cmd=(scripts/prepare_hf_deployment.sh
            --hf-namespace "${GITHUB_EVENT_INPUTS_HF_NAMESPACE}"
            --openenv-version "${GITHUB_EVENT_INPUTS_OPENENV_VERSION}"
            --collection-namespace "${GITHUB_EVENT_INPUTS_COLLECTION_NAMESPACE}"
          )

          if [ "${GITHUB_EVENT_INPUTS_PRIVATE}" = "true" ]; then
            cmd+=(--private)
          else
            cmd+=(--public)
          fi

          if [ "${GITHUB_EVENT_INPUTS_SKIP_COLLECTION}" = "true" ]; then
            cmd+=(--skip-collection)
          fi

          if [ "${GITHUB_EVENT_INPUTS_DRY_RUN}" = "true" ]; then
            cmd+=(--dry-run)
          fi

          if [ -n "$ENVS_CSV_INPUT" ]; then
            IFS=',' read -r -a envs <<< "$ENVS_CSV_INPUT"
            for env_name in "${envs[@]}"; do
              trimmed="$(echo "$env_name" | xargs)"
              if [ -n "$trimmed" ]; then
                cmd+=(--env "$trimmed")
              fi
            done
          else
            cmd+=(--all)
          fi

          echo "Running: ${cmd[*]}"
          "${cmd[@]}"
